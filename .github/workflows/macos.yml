name: macOS

# macOS app (macos/) with the shared core (core/). Releases: tags macos-v*
# (e.g. macos-v0.1.0), independent of the Windows versions. Pull requests
# only run it when they touch these areas.
#
# Signed with the self-signed "DocuClick Signing" identity (macos/packaging/
# create-signing-identity.sh) — no paid Apple Developer ID. Needs the
# repository secrets MAC_SIGN_P12 (base64 of DocuClick-Signing.p12) and
# MAC_SIGN_P12_PASSWORD; without them only the tests run.
on:
  push:
    branches: [ main ]
    tags: [ 'macos-v*' ]
  pull_request:
    branches: [ main ]
    paths: [ 'macos/**', 'core/**', 'obsidian/src/**', 'obsidian/manifest.json', 'obsidian/styles.css', 'global.json', '.github/workflows/macos.yml' ]

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_MAC_SIGNING: ${{ secrets.MAC_SIGN_P12 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # build number = commit count (build-app.sh)

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --project core/DocuClick.Core.Tests --configuration Release

      # Also builds the Swift library (macos/DocuClickMacNative).
      - name: Build
        run: dotnet build macos/DocuClick.Mac/DocuClick.Mac.csproj --configuration Release

      - name: Import signing identity
        id: signing
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/docuclick-signing.keychain-db"
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$MAC_SIGN_P12_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$MAC_SIGN_P12_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MAC_SIGN_P12_PASSWORD" "$KEYCHAIN" >/dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # codesign looks the private key up through the keychain search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity "$KEYCHAIN"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build DocuClick.app
        if: steps.signing.outputs.keychain != ''
        env:
          MAC_SIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          MAC_SIGN_KEYCHAIN_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/macos-v* ]]; then
            macos/packaging/build-app.sh "${GITHUB_REF_NAME#macos-v}"
          else
            macos/packaging/build-app.sh
          fi

      - name: Upload build artifact
        if: steps.signing.outputs.keychain != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DocuClick-macos-arm64
          path: dist/DocuClick-macos-arm64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/macos-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: DocuClick-macos-arm64
          path: publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # "Latest" stays with the Windows app (releases/latest links).
          make_latest: false
          name: DocuClick für macOS ${{ github.ref_name }}
          files: publish/DocuClick-macos-arm64.zip
          generate_release_notes: true
