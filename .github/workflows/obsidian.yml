name: Obsidian

# Obsidian plugin "DocuClick Diagrams" (obsidian/). It bundles the shared
# HTML editor template from core/DocuClick.Core/WebAssets. Releases: tags
# obsidian-v* (e.g. obsidian-v0.1.1), independent of the apps' versions.
on:
  push:
    branches: [ main ]
    tags: [ 'obsidian-v*' ]
  pull_request:
    branches: [ main ]
    paths: [ 'obsidian/**', 'core/DocuClick.Core/WebAssets/**', '.github/workflows/obsidian.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Node 22+: the browser test uses the built-in WebSocket client.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test obsidian/tests/*.test.js

      - name: Build
        run: python3 obsidian/build.py

      # Real Chromium (preinstalled on the runner) with a simulated Obsidian host.
      - name: Browser test
        run: node obsidian/tests/browser.cjs "$(command -v google-chrome)"

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docuclick-diagrams
          path: dist/obsidian-docuclick/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/obsidian-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docuclick-diagrams
          path: publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # "Latest" stays with the Windows app (releases/latest links).
          make_latest: false
          name: DocuClick Diagrams (Obsidian) ${{ github.ref_name }}
          # main.js/manifest.json/styles.css also as single assets, the
          # usual layout of Obsidian plugin releases.
          files: |
            publish/docuclick-diagrams.zip
            publish/docuclick-diagrams/main.js
            publish/docuclick-diagrams/manifest.json
            publish/docuclick-diagrams/styles.css
          generate_release_notes: true
