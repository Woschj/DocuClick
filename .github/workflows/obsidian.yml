name: Obsidian

# Obsidian plugin "DocuClick Diagrams" (obsidian/). It bundles the shared
# HTML editor template from core/DocuClick.Core/WebAssets. Releases:
# release.yml calls this workflow for a tag v* (one release, one version for
# all parts).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths: [ 'obsidian/**', 'core/DocuClick.Core/WebAssets/**', '.github/workflows/obsidian.yml' ]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Node 22+: the browser test uses the built-in WebSocket client.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test obsidian/tests/*.test.js

      - name: Build
        run: python3 obsidian/build.py

      # Real Chromium (preinstalled on the runner) with a simulated Obsidian host.
      - name: Browser test
        run: node obsidian/tests/browser.cjs "$(command -v google-chrome)"

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docuclick-diagrams
          path: dist/obsidian-docuclick/

