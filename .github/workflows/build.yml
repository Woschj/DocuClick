name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DocuClick.sln

      - name: Build
        run: dotnet build DocuClick.sln --configuration Release --no-restore

      # Self-contained single-file exe: runs on a bare Windows machine
      # without a separate .NET runtime install.
      - name: Publish
        run: >
          dotnet publish src/DocuClick/DocuClick.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocuClick-win-x64
          path: publish/DocuClick.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DocuClick-win-x64
          path: publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/DocuClick.exe
          generate_release_notes: true
