name: Windows

# Windows app (windows/) with the shared core (core/). Pull requests only
# run it when they touch these areas. Releases: release.yml calls this
# workflow for a tag v* (one release, one version for all parts).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths: [ 'windows/**', 'core/**', 'obsidian/src/**', 'obsidian/manifest.json', 'obsidian/styles.css', 'global.json', '.github/workflows/windows.yml' ]
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build windows/DocuClick/DocuClick.csproj --configuration Release

      - name: Test
        run: dotnet test --project core/DocuClick.Core.Tests --configuration Release

      # Self-contained (non-single-file) build: runs on a bare Windows
      # machine without a separate .NET runtime install. Single-file
      # publish is deliberately avoided here — its self-extracting temp
      # unpacking at startup is a common false-positive trigger for
      # Windows Defender's ML heuristics (e.g. Wacatac.B!ml) on unsigned
      # binaries.
      - name: Publish
        run: >
          dotnet publish windows/DocuClick/DocuClick.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Zip publish output
        run: Compress-Archive -Path publish/* -DestinationPath DocuClick-win-x64.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DocuClick-win-x64
          path: DocuClick-win-x64.zip

