name: Windows

# Windows app (windows/) with the shared core (core/). Releases: tags v*
# (e.g. v1.14.0) — the historic tag scheme of the Windows app. Pull
# requests only run it when they touch these areas (a path filter on push
# would also swallow tag pushes).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths: [ 'windows/**', 'core/**', 'obsidian/src/**', 'obsidian/manifest.json', 'obsidian/styles.css', 'OutputTemplate/**', 'global.json', '.github/workflows/windows.yml' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build windows/DocuClick/DocuClick.csproj --configuration Release

      - name: Test
        run: dotnet test --project core/DocuClick.Core.Tests --configuration Release

      # Self-contained (non-single-file) build: runs on a bare Windows
      # machine without a separate .NET runtime install. Single-file
      # publish is deliberately avoided here — its self-extracting temp
      # unpacking at startup is a common false-positive trigger for
      # Windows Defender's ML heuristics (e.g. Wacatac.B!ml) on unsigned
      # binaries.
      - name: Publish
        run: >
          dotnet publish windows/DocuClick/DocuClick.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Zip publish output
        run: Compress-Archive -Path publish/* -DestinationPath DocuClick-win-x64.zip
        shell: pwsh

      # Separate zip (not merged into the app's own zip) so the app
      # payload stays just the exe/DLLs — this is a blank output folder
      # to copy out and use, not part of the program.
      - name: Zip output template
        run: Compress-Archive -Path OutputTemplate/* -DestinationPath OutputTemplate.zip
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: DocuClick-win-x64
          path: DocuClick-win-x64.zip

      - name: Upload output template artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: OutputTemplate
          path: OutputTemplate.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: DocuClick-win-x64
          path: publish

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: OutputTemplate
          path: publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: DocuClick für Windows ${{ github.ref_name }}
          files: |
            publish/DocuClick-win-x64.zip
            publish/OutputTemplate.zip
          generate_release_notes: true
